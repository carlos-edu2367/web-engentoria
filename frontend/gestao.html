<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Engentoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SCRIPT DO FULLCALENDAR ADICIONADO AQUI -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    
    <!-- CONFIGURAÇÃO DA API EMBUTIDA PARA EVITAR ERROS DE CAMINHO -->
    <script>
        window.APP_CONFIG = {
            API_BASE_URL_ADMIN: (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost')
                ? 'http://127.0.0.1:8000/api/v1/admin-panel'
                : '/api/v1/admin-panel'
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='90' font-family='Inter, sans-serif' font-weight='700' fill='%2300ffb3'>e</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            background-image: 
                linear-gradient(rgba(0, 255, 179, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 179, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0, 255, 179, 0) 0%, rgba(0, 255, 179, 0.02) 50%, rgba(0, 255, 179, 0) 100%);
            background-size: 100% 8px;
            animation: scan 4s linear infinite;
            pointer-events: none; z-index: 1;
        }
        
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #00ffb3; border-radius: 4px; }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .nav-link.active {
            background: rgba(0, 255, 179, 0.1);
            color: #00ffb3;
            border-left: 3px solid #00ffb3;
        }
        
        .nav-link.active svg {
            filter: drop-shadow(0 0 4px rgba(0, 255, 179, 0.5));
        }
        
        .neon-border {
            border: 1px solid rgba(0, 255, 179, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 179, 0.1), inset 0 0 10px rgba(0, 255, 179, 0.1);
        }

        /* Estilos FullCalendar */
        :root {
            --fc-border-color: #374151;
            --fc-daygrid-event-dot-width: 8px;
            --fc-list-event-dot-width: 10px;
            --fc-event-text-color: #e5e7eb;
            --fc-day-today-bg-color: rgba(0, 255, 179, 0.1);
        }
        .fc .fc-toolbar-title { font-size: 1.25rem; color: #e5e7eb; }
        .fc .fc-button-primary { background-color: #1f2937; border-color: #374151; }
        .fc .fc-button-primary:hover { background-color: #374151; }
        .fc .fc-daygrid-day-number { color: #9ca3af; }
        .fc .fc-col-header-cell-cushion { color: #d1d5db; }
        .fc-event { cursor: pointer; }

        /* Estilos para o novo Laudo Viewer */
        .laudo-header {
            background: linear-gradient(145deg, #1f2937, #111827);
        }
        .laudo-categoria summary {
            background-color: rgba(31, 41, 55, 0.7);
            transition: background-color 0.2s;
        }
        .laudo-categoria summary:hover {
            background-color: rgba(55, 65, 81, 0.7);
        }
        .laudo-categoria summary svg {
            transition: transform 0.2s;
        }
        .laudo-categoria[open] summary svg {
            transform: rotate(180deg);
        }
        .laudo-item {
            background-color: rgba(17, 24, 39, 0.5);
        }
        .laudo-image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.75rem; /* 12px */
        }
        .laudo-image-thumbnail {
            width: 100%;
            padding-top: 100%; /* Aspect ratio 1:1 */
            background-size: cover;
            background-position: center;
            border-radius: 0.5rem; /* 8px */
            cursor: pointer;
            border: 2px solid #374151;
            transition: border-color 0.2s;
        }
        .laudo-image-thumbnail:hover {
            border-color: #00ffb3;
        }
        #laudo-image-viewer {
            transition: opacity 0.3s;
        }
        #laudo-image-viewer img {
            max-height: 90vh;
            max-width: 90vw;
            animation: zoomIn 0.3s ease-out;
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body class="text-gray-200">

    <div class="scanline"></div>
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-80 z-50"></div>

    <aside class="fixed top-0 left-0 h-full w-64 bg-gray-800/90 backdrop-blur-sm border-r border-gray-700/50 flex flex-col z-40">
        <div class="flex items-center justify-center h-20 border-b border-gray-700/50">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 to-emerald-300">
                Painel de Gestão
            </h1>
        </div>
        <nav class="flex-grow p-4 space-y-2" id="admin-nav">
            <a href="#dashboard" class="nav-link active flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="ml-4">Dashboard</span>
            </a>
            <a href="#grupos" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                <span class="ml-4">Grupos de Imobiliárias</span>
            </a>
            <a href="#vistoriadores" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.125-1.283-.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="ml-4">Vistoriadores</span>
            </a>
            <a href="#clientes" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                 <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="ml-4">Clientes</span>
            </a>
             <a href="#imoveis" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="ml-4">Imóveis</span>
            </a>
            <a href="#agenda" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="ml-4">Agenda</span>
            </a>
            <!-- NOVO LINK: IMPRODUTIVAS -->
            <a href="#improdutivas" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="ml-4">Improdutivas</span>
            </a>
            <!-- FIM DO NOVO LINK -->
            <a href="#laudos" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="ml-4">Laudos Pendentes</span>
            </a>
            <a href="#relatorios" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="ml-4">Relatórios</span>
            </a>
            <a href="#configuracoes" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924-1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="ml-4">Configurações</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700/50">
             <div id="user-info" class="mb-4 text-center">
                <p class="text-sm font-semibold text-cyan-300" id="user-name"></p>
                <p class="text-xs text-gray-400" id="user-email"></p>
            </div>
            <button id="logout-button" class="w-full flex items-center p-3 rounded-lg hover:bg-red-500/20 text-red-400 transition-colors">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="ml-4">Sair</span>
            </button>
        </div>
    </aside>

    <main class="ml-64 p-4 sm:p-8"> <!-- Ajuste de padding para mobile -->
        <div id="page-content">
            <!-- O conteúdo da página será carregado aqui dinamicamente -->
        </div>
    </main>
    
    <!-- Modal Genérico -->
    <div id="generic-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div id="modal-content" class_DEFAULT="bg-gray-800/90 backdrop-blur-sm rounded-xl shadow-xl p-4 sm:p-6 w-full max-w-2xl border border-gray-700/50 max-h-[90vh] overflow-y-auto neon-border">
            <!-- O conteúdo do modal será inserido aqui dinamicamente -->
        </div>
    </div>

    <!-- NOVO: Modal para Visualização de Imagem do Laudo -->
    <div id="laudo-image-viewer" class="fixed inset-0 bg-black/80 z-[60] hidden items-center justify-center p-4 backdrop-blur-sm opacity-0" onclick="this.classList.add('opacity-0'); setTimeout(() => this.classList.add('hidden'), 300)">
        <img src="" alt="Visualização de Imagem" class="rounded-lg shadow-2xl">
    </div>

    <script src="assets/auth.js"></script>
    <script src="assets/gestao.js" type="module"></script>
</body>
</html>
