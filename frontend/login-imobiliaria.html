<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal da Imobiliária</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='90' font-family='Inter, sans-serif' font-weight='700' fill='%2300ffb3'>e</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            background-image: 
                linear-gradient(rgba(0, 255, 179, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 179, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            position: relative;
            overflow: hidden;
        }
        
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0, 255, 179, 0) 0%,
                rgba(0, 255, 179, 0.02) 50%,
                rgba(0, 255, 179, 0) 100%
            );
            background-size: 100% 8px;
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        
        .neon-border {
            position: relative;
            border: 1px solid rgba(0, 255, 179, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 179, 0.2),
                        inset 0 0 10px rgba(0, 255, 179, 0.2);
            transition: all 0.3s ease;
        }
        
        .neon-border:hover {
            box-shadow: 0 0 15px rgba(0, 255, 179, 0.4),
                        inset 0 0 15px rgba(0, 255, 179, 0.4);
        }
        
        .input-focus-effect:focus {
            box-shadow: 0 0 0 2px rgba(0, 255, 179, 0.5);
            border-color: rgba(0, 255, 179, 0.5);
        }
        
        .btn-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 179, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative">

    <!-- Efeito de escaneamento -->
    <div class="scanline"></div>
    
    <!-- Linha superior futurista -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-80"></div>

    <div class="w-full max-w-md bg-gray-800/90 backdrop-blur-sm rounded-xl shadow-2xl p-8 neon-border relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 to-emerald-300 mb-2">
                Portal da Imobiliária
            </h1>
            <p class="text-gray-400">Acesse sua agenda e relatórios</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                <div class="relative">
                    <input type="email" id="email" name="email" required
                           class="block w-full bg-gray-700/50 border border-gray-600 text-white rounded-lg shadow-sm py-3 px-4 pl-10 focus:outline-none input-focus-effect transition placeholder-gray-500"
                           placeholder="seu@email.com">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Senha</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                           class="block w-full bg-gray-700/50 border border-gray-600 text-white rounded-lg shadow-sm py-3 px-4 pl-10 focus:outline-none input-focus-effect transition placeholder-gray-500"
                           placeholder="••••••••">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            <div>
                <button type="submit" id="login-button"
                        class="w-full flex justify-center items-center py-3 px-4 rounded-lg font-bold text-gray-900 bg-gradient-to-r from-cyan-400 to-emerald-400 shadow-lg transition-all duration-300 btn-hover-effect">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                    </svg>
                    Entrar
                </button>
            </div>
        </form>

        <div id="error-message" class="hidden mt-4 text-center text-red-400 bg-red-900/50 p-3 rounded-md border border-red-800/50"></div>

        <div class="text-center mt-6">
            <a href="index.html" class="text-sm text-cyan-400 hover:text-cyan-300 transition flex items-center justify-center">
                <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Voltar para a página inicial
            </a>
        </div>
    </div>

    <script src="./assets/auth.js"></script>
    <script src="./assets/main.js"></script>
</body>
</html>
