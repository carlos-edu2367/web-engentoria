<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Portal da Imobiliária</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='90' font-family='Inter, sans-serif' font-weight='700' fill='%2310b981'>I</text></svg>">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* FullCalendar Customization */
        .fc { --fc-border-color: #374151; --fc-page-bg-color: transparent; --fc-list-event-hover-bg-color: #1f2937; }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #374151; }
        .fc-day-today { background: rgba(16, 185, 129, 0.1) !important; }
        .fc-toolbar-title { font-size: 1.25rem !important; font-weight: 700; color: white; }
        .fc-button-primary { background-color: #1f2937 !important; border-color: #374151 !important; }
        .fc-button-primary:hover { background-color: #374151 !important; }
        .fc-button-active { background-color: #10b981 !important; border-color: #10b981 !important; }
        .fc-event { cursor: pointer; border: none; }
    </style>
</head>
<body class="h-screen flex overflow-hidden selection:bg-green-500/30">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col shadow-2xl z-20">
        <div class="h-16 flex items-center px-6 border-b border-gray-800 bg-gray-900/50 backdrop-blur">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-gradient-to-br from-green-500 to-emerald-700 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-green-500/20">I</div>
                <span class="text-lg font-bold text-white tracking-tight">Imobiliária</span>
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar">
            <p class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Visão Geral</p>
            <a href="#dashboard" class="nav-link flex items-center px-4 py-3 text-sm font-medium text-gray-400 rounded-lg transition-all group hover:bg-gray-800 hover:text-white">
                <svg class="w-5 h-5 mr-3 text-gray-500 group-hover:text-green-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            
            <a href="#laudos" data-permissao="vistorias" class="nav-link flex items-center px-4 py-3 text-sm font-medium text-gray-400 rounded-lg transition-all group hover:bg-gray-800 hover:text-white">
                <svg class="w-5 h-5 mr-3 text-gray-500 group-hover:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Laudos Entregues
            </a>

            <a href="#relatorios" data-permissao="financeiro" class="nav-link flex items-center px-4 py-3 text-sm font-medium text-gray-400 rounded-lg transition-all group hover:bg-gray-800 hover:text-white">
                <svg class="w-5 h-5 mr-3 text-gray-500 group-hover:text-yellow-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                Relatórios & Fechamento
            </a>

            <div data-permissao="vistorias" class="pt-4 mt-4 border-t border-gray-800">
                <p class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Ferramentas</p>
                
                <a href="#agendar" class="nav-link flex items-center px-4 py-3 text-sm font-medium text-gray-400 rounded-lg transition-all group hover:bg-gradient-to-r hover:from-purple-900/50 hover:to-transparent hover:text-white">
                    <svg class="w-5 h-5 mr-3 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Agendamento
                </a>
            </div>
        </nav>

        <div class="p-4 border-t border-gray-800 bg-gray-900">
            <p id="usuario-logado" class="px-1 mb-3 text-xs text-gray-500 truncate"></p>
            <button onclick="window.logout()" class="w-full flex items-center justify-center p-2 rounded-lg bg-red-900/10 text-red-400 hover:bg-red-900/30 transition-colors text-sm font-medium">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sair
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 bg-black/95 relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-800/20 via-gray-900/0 to-gray-900/0">
        <div class="absolute top-0 left-0 w-full h-8 bg-gradient-to-b from-black/50 to-transparent z-10 pointer-events-none"></div>
        <div id="page-content" class="h-full overflow-y-auto custom-scrollbar p-6 md:p-8">
            <!-- Dynamic Content -->
        </div>
    </main>

    <!-- Auth Globals -->
    <script src="assets/auth.js"></script>
    <!-- Main Module -->
    <script type="module" src="assets/imobiliaria.js"></script>

    <script>
        // Global logout helper if auth.js is not loaded properly or for fallback
        window.logout = function() {
            localStorage.removeItem('engentoria_vist_token');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
