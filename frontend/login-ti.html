<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área de TI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='90' font-family='Inter, sans-serif' font-weight='700' fill='%23f97316'>e</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            background-image: linear-gradient(rgba(249, 115, 22, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                rgba(249, 115, 22, 0) 0%,
                rgba(249, 115, 22, 0.02) 50%,
                rgba(249, 115, 22, 0) 100%);
            background-size: 100% 8px;
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100%);
            }
        }

        .login-card {
            background: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(249, 115, 22, 0.2);
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.1),
                inset 0 0 10px rgba(249, 115, 22, 0.1);
        }

        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.3);
            border-color: rgba(249, 115, 22, 0.5);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <!-- Efeito de escaneamento -->
    <div class="scanline"></div>

    <!-- Linha superior futurista -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-orange-400 to-transparent opacity-80 z-50"></div>

    <div class="w-full max-w-md login-card rounded-xl p-8 fade-in">
        <!-- Logo e Título -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-orange-400 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-2xl font-bold text-gray-900">e</span>
            </div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-300 to-amber-300 mb-2">Área de TI</h1>
            <p class="text-gray-400">Acesse o painel de gestão do sistema</p>
        </div>

        <!-- Formulário de Login -->
        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" id="email" name="email" required class="input-field w-full bg-gray-700/50 border border-gray-600/50 text-white rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Senha</label>
                <input type="password" id="password" name="password" required class="input-field w-full bg-gray-700/50 border border-gray-600/50 text-white rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition">
            </div>
            <div>
                <button type="submit" id="login-button" class="w-full flex justify-center items-center py-3 px-4 rounded-lg shadow-sm text-sm font-bold text-gray-900 bg-gradient-to-r from-orange-400 to-amber-400 hover:from-orange-500 hover:to-amber-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500/50 focus:ring-offset-gray-800 transition-all duration-300 transform hover:scale-[1.02]">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                    </svg>
                    Entrar
                </button>
            </div>
        </form>

        <!-- Mensagem de Erro -->
        <div id="error-message" class="hidden mt-4 text-center text-red-400 bg-red-900/30 p-3 rounded-lg border border-red-700/50"></div>

        <!-- Link de Voltar -->
        <div class="text-center mt-6 pt-6 border-t border-gray-700/50">
            <a href="index.html" class="text-sm text-orange-400 hover:text-orange-300 hover:underline transition-colors flex items-center justify-center">
                <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Voltar para a página inicial
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./assets/auth.js"></script>
    <script src="./assets/main.js"></script>
</body>
</html>
