<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda e Suporte - Portal Engentoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='90' font-family='Inter, sans-serif' font-weight='700' fill='%2300ffb3'>e</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
            background-image: linear-gradient(rgba(0, 255, 179, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 179, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0, 255, 179, 0) 0%, rgba(0, 255, 179, 0.02) 50%, rgba(0, 255, 179, 0) 100%);
            background-size: 100% 8px; animation: scan 4s linear infinite; pointer-events: none; z-index: 1;
        }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #00ffb3; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-link.active {
            background: rgba(0, 255, 179, 0.1); color: #00ffb3; border-left: 3px solid #00ffb3;
        }
        .nav-link.active svg { filter: drop-shadow(0 0 4px rgba(0, 255, 179, 0.5)); }
        .neon-border {
            border: 1px solid rgba(0, 255, 179, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 179, 0.1), inset 0 0 10px rgba(0, 255, 179, 0.1);
        }
        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(0, 255, 179, 0.3);
            border-color: rgba(0, 255, 179, 0.5);
        }
    </style>
</head>
<body class="text-gray-200">
    <!-- Efeitos Visuais -->
    <div class="scanline"></div>
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-80 z-50"></div>

    <!-- Overlay para fechar a sidebar no mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-gray-800/90 backdrop-blur-sm border-r border-gray-700/50 flex flex-col z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="flex items-center justify-center h-20 border-b border-gray-700/50">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 to-emerald-300">Engentoria</h1>
        </div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="agenda.html" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition-colors">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="ml-4">Minha Agenda</span>
            </a>
            <!-- NOVO LINK ADICIONADO -->
            <a href="relatorios-vistoriador.html" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition-colors">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="ml-4">Meus Relatórios</span>
            </a>
            <a href="ajuda.html" class="nav-link active flex items-center p-3 rounded-lg transition-colors">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.546-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="ml-4">Ajuda e Suporte</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700/50">
            <button id="logout-button" class="w-full flex items-center p-3 rounded-lg hover:bg-red-500/20 text-red-400 transition-colors">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="ml-4">Sair</span>
            </button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="md:ml-64 p-4 md:p-8 transition-all duration-300">
        <!-- Header para Mobile com botão de abrir menu -->
        <header class="flex justify-between items-center mb-6 md:hidden">
             <h1 class="text-2xl font-bold text-white">Ajuda e Suporte</h1>
            <button id="open-sidebar-btn" class="p-2 rounded-md hover:bg-gray-700/50">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>
        
        <div class="max-w-4xl mx-auto fade-in">
            <div class="hidden md:block">
                <h1 class="text-3xl font-bold text-white">Ajuda e Suporte</h1>
                <p class="text-gray-400 mt-1">Precisa de ajuda? Abra um chamado de suporte.</p>
            </div>

            <div class="mt-8 bg-gray-800/80 backdrop-blur-sm rounded-xl shadow-lg p-6 md:p-8 neon-border">
                <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 to-emerald-300 mb-6">Abrir Novo Chamado</h2>
                
                <!-- Formulário de Suporte -->
                <form id="support-form" class="space-y-6">
                    <div>
                        <label for="titulo" class="block text-sm font-medium text-gray-300 mb-1">Título</label>
                        <input type="text" id="titulo" name="titulo" required placeholder="Ex: Problema ao sincronizar vistoria"
                               class="input-field w-full bg-gray-700/50 border border-gray-600/50 text-white rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="categoria" class="block text-sm font-medium text-gray-300 mb-1">Categoria</label>
                            <select id="categoria" name="categoria" required class="input-field w-full bg-gray-700/50 border border-gray-600/50 text-white rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition appearance-none">
                                <option>Dúvida</option>
                                <option>Problema Técnico</option>
                                <option>Sugestão</option>
                                <option>Outro</option>
                            </select>
                        </div>
                        <div>
                            <label for="prioridade" class="block text-sm font-medium text-gray-300 mb-1">Prioridade</label>
                            <select id="prioridade" name="prioridade" required class="input-field w-full bg-gray-700/50 border border-gray-600/50 text-white rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition appearance-none">
                                <option>Baixa</option>
                                <option>Média</option>
                                <option>Alta</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="descricao" class="block text-sm font-medium text-gray-300 mb-1">Descrição</label>
                        <textarea id="descricao" name="descricao" rows="4" required placeholder="Descreva o problema ou sua dúvida com o máximo de detalhes possível."
                                  class="input-field w-full bg-gray-700/50 border border-gray-600/50 text-white rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition"></textarea>
                    </div>

                    <div>
                        <button type="submit" id="support-button"
                                class="w-full md:w-auto flex justify-center items-center py-3 px-6 rounded-lg shadow-sm text-sm font-bold text-gray-900 bg-gradient-to-r from-cyan-400 to-emerald-400 hover:from-cyan-500 hover:to-emerald-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500/50 focus:ring-offset-gray-800 transition-all duration-300 transform hover:scale-[1.02]">
                            Enviar Chamado
                        </button>
                    </div>
                </form>
                 <!-- Fim do Formulário -->

                 <!-- Mensagem de Sucesso/Erro -->
                 <div id="form-message" class="hidden mt-4 text-center p-3 rounded-lg border"></div>
            </div>
        </div>
    </main>
    
    <script src="./assets/auth.js"></script>
    <script src="./assets/main.js"></script>
</body>
</html>
