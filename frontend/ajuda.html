<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda e Suporte - Portal Engentoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- Barra Lateral (Sidebar) - a mesma da agenda para consistência -->
    <aside class="fixed top-0 left-0 h-full w-16 md:w-64 bg-gray-800 border-r border-gray-700 flex flex-col transition-all duration-300">
        <div class="flex items-center justify-center h-20 border-b border-gray-700">
            <a href="agenda.html" class="text-2xl font-bold text-green-400 hidden md:block">Engentoria</a>
            <a href="agenda.html" class="text-3xl md:hidden">E</a>
        </div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="agenda.html" class="flex items-center p-3 rounded-lg hover:bg-gray-700 transition-colors">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="ml-4 hidden md:block">Minha Agenda</span>
            </a>
            <a href="#" class="flex items-center p-3 rounded-lg bg-green-500/20 text-green-300">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.546-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="ml-4 hidden md:block">Ajuda e Suporte</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <button id="logout-button" class="w-full flex items-center p-3 rounded-lg hover:bg-red-500/20 text-red-400 transition-colors">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="ml-4 hidden md:block">Sair</span>
            </button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="ml-16 md:ml-64 p-4 md:p-8 transition-all duration-300">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold text-white">Ajuda e Suporte</h1>
            <p class="text-gray-400 mt-1">Precisa de ajuda? Abra um chamado de suporte.</p>

            <div class="mt-8 bg-gray-800 rounded-2xl shadow-lg p-8 border border-gray-700">
                <h2 class="text-2xl font-bold text-green-400 mb-6">Abrir Novo Chamado</h2>
                
                <!-- Formulário de Suporte -->
                <form id="support-form" class="space-y-6">
                    <div>
                        <label for="titulo" class="block text-sm font-medium text-gray-300">Título</label>
                        <input type="text" id="titulo" name="titulo" required placeholder="Ex: Problema ao sincronizar vistoria"
                               class="mt-1 block w-full bg-gray-700 border-gray-600 text-white rounded-md shadow-sm py-3 px-4 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="categoria" class="block text-sm font-medium text-gray-300">Categoria</label>
                            <select id="categoria" name="categoria" required class="mt-1 block w-full bg-gray-700 border-gray-600 text-white rounded-md shadow-sm py-3 px-4 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition">
                                <option>Dúvida</option>
                                <option>Problema Técnico</option>
                                <option>Sugestão</option>
                                <option>Outro</option>
                            </select>
                        </div>
                        <div>
                            <label for="prioridade" class="block text-sm font-medium text-gray-300">Prioridade</label>
                            <select id="prioridade" name="prioridade" required class="mt-1 block w-full bg-gray-700 border-gray-600 text-white rounded-md shadow-sm py-3 px-4 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition">
                                <option>Baixa</option>
                                <option>Média</option>
                                <option>Alta</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="descricao" class="block text-sm font-medium text-gray-300">Descrição</label>
                        <textarea id="descricao" name="descricao" rows="4" required placeholder="Descreva o problema ou sua dúvida com o máximo de detalhes possível."
                                  class="mt-1 block w-full bg-gray-700 border-gray-600 text-white rounded-md shadow-sm py-3 px-4 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition"></textarea>
                    </div>

                    <div>
                        <button type="submit" id="support-button"
                                class="w-full md:w-auto inline-flex justify-center py-3 px-6 border border-transparent rounded-md shadow-sm text-sm font-bold text-gray-900 bg-green-500 hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 focus:ring-offset-gray-800 transition-all duration-300 transform hover:scale-105">
                            Enviar Chamado
                        </button>
                    </div>
                </form>
                 <!-- Fim do Formulário -->

                 <!-- Mensagem de Sucesso/Erro -->
                 <div id="form-message" class="hidden mt-4 text-center p-3 rounded-md"></div>
            </div>
        </div>
    </main>
    
    <script src="./assets/auth.js"></script>
    <script src="./assets/main.js"></script>
</body>
</html>
