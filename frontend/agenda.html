<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Agenda - Portal Engentoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4ade80; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #22c55e; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .star-rating input { display: none; }
        .star-rating label { font-size: 2.5rem; color: #4b5563; cursor: pointer; transition: color 0.2s; }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- Overlay e Sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-gray-800 border-r border-gray-700 flex flex-col z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="flex items-center justify-between h-20 border-b border-gray-700 px-4">
            <h1 class="text-2xl font-bold text-green-400">Engentoria</h1>
            <button id="close-sidebar-btn" class="p-2 rounded-full hover:bg-gray-700 md:hidden">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="#" class="flex items-center p-3 rounded-lg bg-green-500/20 text-green-300">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="ml-4">Minha Agenda</span>
            </a>
            <a href="ajuda.html" class="flex items-center p-3 rounded-lg hover:bg-gray-700 transition-colors">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.546-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="ml-4">Ajuda e Suporte</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <button id="logout-button" class="w-full flex items-center p-3 rounded-lg hover:bg-red-500/20 text-red-400 transition-colors">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="ml-4">Sair</span>
            </button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="md:ml-64 p-4 md:p-8 transition-all duration-300">
        <header class="flex justify-between items-center mb-6 md:hidden">
             <h1 class="text-2xl font-bold text-white">Minha Agenda</h1>
            <button id="open-sidebar-btn" class="p-2 rounded-md hover:bg-gray-700">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold text-white hidden md:block">Minha Agenda</h1>
            <p class="text-gray-400 mt-1" id="welcome-message">Bem-vindo(a) de volta!</p>

            <!-- Filtros -->
            <div class="mt-6 space-y-4">
                 <div>
                    <h3 class="text-sm font-semibold text-gray-400 mb-2">Filtrar por Período</h3>
                    <div class="flex flex-wrap gap-2" id="period-filter-buttons">
                        <button data-period="semana_passada" class="period-filter-btn bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Semana Passada</button>
                        <button data-period="hoje" class="period-filter-btn bg-green-500 text-gray-900 font-semibold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">Hoje</button>
                        <button data-period="amanha" class="period-filter-btn bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Amanhã</button>
                        <button data-period="semana" class="period-filter-btn bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Esta Semana</button>
                        <button data-period="mes" class="period-filter-btn bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Este Mês</button>
                    </div>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-gray-400 mb-2">Filtrar por Status</h3>
                    <div class="flex flex-wrap gap-2" id="status-filter-buttons">
                        <button data-status="todos" class="status-filter-btn bg-green-500 text-gray-900 font-semibold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">Todos</button>
                        <button data-status="agendados" class="status-filter-btn bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Agendados</button>
                        <button data-status="livres" class="status-filter-btn bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Livres</button>
                    </div>
                </div>
            </div>

            <!-- Container da Agenda -->
            <div id="agenda-container" class="mt-6 space-y-4"></div>
        </div>
    </main>
    
    <!-- Notificação Toast para Feedback -->
    <div id="feedback-toast" class="fixed top-5 right-5 z-50 cursor-pointer bg-yellow-500 text-yellow-900 px-6 py-3 rounded-lg shadow-lg transform opacity-0 -translate-y-20 transition-all duration-500 ease-in-out">
        <p><strong class="font-bold">Gostou da nova versão?</strong> Clique aqui para deixar seu feedback!</p>
    </div>

    <!-- Modal de Feedback -->
    <div id="feedback-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-2 text-green-400">Avalie o App</h2>
            <p class="text-gray-400 mb-4">Seu feedback é muito importante para nós!</p>
            <form id="feedback-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Sua nota:</label>
                    <div class="star-rating flex flex-row-reverse justify-end">
                        <input type="radio" id="star5" name="nota" value="5" required><label for="star5">☆</label>
                        <input type="radio" id="star4" name="nota" value="4"><label for="star4">☆</label>
                        <input type="radio" id="star3" name="nota" value="3"><label for="star3">☆</label>
                        <input type="radio" id="star2" name="nota" value="2"><label for="star2">☆</label>
                        <input type="radio" id="star1" name="nota" value="1"><label for="star1">☆</label>
                    </div>
                </div>
                <div>
                    <label for="comentario" class="block text-sm font-medium">Comentário (opcional):</label>
                    <textarea id="comentario" name="comentario" rows="4" placeholder="Deixe sua sugestão ou relate um problema..." class="w-full p-2 mt-1 bg-gray-700 rounded border border-gray-600"></textarea>
                </div>
                <div id="feedback-error" class="text-red-400 text-sm mt-2 hidden"></div>
                <div class="flex justify-end gap-4 pt-4 mt-4">
                    <button type="button" id="cancel-feedback-btn" class="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded">Cancelar</button>
                    <button type="submit" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">Enviar Feedback</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="./assets/auth.js"></script>
    <script src="./assets/main.js"></script>
</body>
</html>
