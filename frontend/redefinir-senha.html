<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Engentoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='90' font-family='Inter, sans-serif' font-weight='700' fill='%2300ffb3'>e</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            background-image: linear-gradient(rgba(0, 255, 179, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 179, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0, 255, 179, 0) 0%, rgba(0, 255, 179, 0.02) 50%, rgba(0, 255, 179, 0) 100%);
            background-size: 100% 8px; animation: scan 4s linear infinite; pointer-events: none; z-index: 1;
        }

        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

        .reset-card {
            background: rgba(31, 41, 55, 0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 179, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 179, 0.1), inset 0 0 10px rgba(0, 255, 179, 0.1);
        }

        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(0, 255, 179, 0.3); border-color: rgba(0, 255, 179, 0.5);
        }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="scanline"></div>
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-80 z-50"></div>

    <div class="w-full max-w-md reset-card rounded-xl p-8 fade-in">
        <h1 class="text-3xl font-bold text-center bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 to-emerald-300 mb-2">Redefinir Senha</h1>
        <p class="text-center text-gray-400 mb-8">Crie uma nova senha para sua conta.</p>

        <form id="reset-password-form" class="space-y-6">
            <input type="hidden" id="token" name="token">
            <div>
                <label for="new_password" class="block text-sm font-medium text-gray-300 mb-1">Nova Senha</label>
                <input type="password" id="new_password" name="new_password" required minlength="6"
                       class="input-field w-full bg-gray-700/50 border border-gray-600/50 text-white rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition">
            </div>
             <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-1">Confirme a Nova Senha</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                       class="input-field w-full bg-gray-700/50 border border-gray-600/50 text-white rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition">
            </div>
            
            <div>
                <button type="submit" id="reset-button"
                        class="w-full flex justify-center items-center py-3 px-4 rounded-lg shadow-sm text-sm font-bold text-gray-900 bg-gradient-to-r from-cyan-400 to-emerald-400 hover:from-cyan-500 hover:to-emerald-500 transition-all">
                    Redefinir Senha
                </button>
            </div>
        </form>

        <div id="form-message" class="hidden mt-4 text-center p-3 rounded-lg border"></div>

        <div id="login-link-container" class="hidden text-center mt-6 pt-6 border-t border-gray-700/50">
            <a href="login.html" class="text-sm text-cyan-400 hover:text-cyan-300 hover:underline transition-colors flex items-center justify-center">
                <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Ir para o Login
            </a>
        </div>
    </div>

    <script src="./assets/auth.js"></script>
    <script src="./assets/main.js"></script>
</body>
</html>
